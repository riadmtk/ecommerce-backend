<div class="auth-container">
  <div class="auth-card">
    <h2>Nouveau mot de passe</h2>
    
    <div *ngIf="errorMessage" class="alert error-alert">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert success-alert">
      {{ successMessage }} <br> Redirection vers la connexion...
    </div>

    <form (ngSubmit)="onSubmit()" *ngIf="token && !successMessage">
      <div class="form-group">
        <label for="newPassword">Nouveau mot de passe</label>
        <input 
          type="password" 
          id="newPassword" 
          name="newPassword" 
          [(ngModel)]="newPassword" 
          required 
          [disabled]="isLoading">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          [(ngModel)]="confirmPassword" 
          required 
          [disabled]="isLoading">
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading || !newPassword || !confirmPassword">
        {{ isLoading ? 'Modification...' : 'Enregistrer' }}
      </button>
    </form>
    
    <div class="auth-links" *ngIf="!token || errorMessage">
      <a routerLink="/auth/forgot-password">Demander un nouveau lien</a>
    </div>
  </div>
</div>
