<div class="auth-container">
  <div class="auth-card">
    <h2>Mot de passe oublié ?</h2>
    <p class="subtitle">Entrez votre adresse email pour recevoir un lien de réinitialisation.</p>

    <div *ngIf="successMessage" class="alert success-alert">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" *ngIf="!successMessage">
      <div class="form-group">
        <label for="email">Adresse email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          placeholder="exemple@email.com"
          [disabled]="isLoading">
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading || !email">
        {{ isLoading ? 'Envoi en cours...' : 'Envoyer le lien' }}
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/auth/login">← Retour à la connexion</a>
    </div>
  </div>
</div>
