<div class="register-container">
  <div class="register-card">
    <h2>Créer un compte</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="form-row">
        <div class="form-group">
          <label>Prénom</label>
          <input type="text" formControlName="firstName" placeholder="Votre prénom" />
          <span class="error-msg"
            *ngIf="registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched">
            Prénom requis (min. 2 caractères)
          </span>
        </div>

        <div class="form-group">
          <label>Nom</label>
          <input type="text" formControlName="lastName" placeholder="Votre nom" />
          <span class="error-msg"
            *ngIf="registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched">
            Nom requis (min. 2 caractères)
          </span>
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="Votre adresse Email" />
        <span class="error-msg"
          *ngIf="registerForm.get('email')?.hasError('email') && registerForm.get('email')?.touched">
          Format email invalide
        </span>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" formControlName="password" placeholder="Votre mot de passe" />
        <span class="error-msg"
          *ngIf="registerForm.get('password')?.hasError('pattern') && registerForm.get('password')?.touched">
          Doit contenir 1 majuscule, 1 chiffre et 1 caractère spécial
        </span>
      </div>

      <div class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" [disabled]="registerForm.invalid || isLoading">
        {{ isLoading ? 'Inscription...' : 'S\'inscrire' }}
      </button>

      <p class="redirect">
        Déjà un compte ? <a routerLink="/auth/login">Se connecter</a>
      </p>

    </form>
  </div>
</div>
