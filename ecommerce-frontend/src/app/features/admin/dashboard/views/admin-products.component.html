<div class="admin-view-container">
  <div class="view-header">
    <h1>Gestion des Produits</h1>
    <div class="header-actions" style="display: flex; gap: 16px;">
      <div class="search-bar">
        <input type="text" [(ngModel)]="searchTerm" (input)="filterProducts()" placeholder="Rechercher par ID ou Nom..." />
      </div>
      <a routerLink="/admin/dashboard/products/add" class="btn-primary" style="padding: 10px 16px; border-radius: 8px; text-decoration: none; font-size: 14px;">
        + Nouveau Produit
      </a>
    </div>
  </div>

  <div *ngIf="isLoading" class="loading">Chargement des produits...</div>

  <div class="table-container" *ngIf="!isLoading">
    <table class="admin-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Image</th>
          <th>Nom</th>
          <th>Prix</th>
          <th>Stock</th>
          <th>Gérer</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of filteredProducts">
          <td class="id-cell" title="Copier l'ID" (click)="copyId(product.id!)" style="cursor: pointer; color: #1d4ed8;">
            {{ product.id }} 
            <span *ngIf="copiedId === product.id" style="color: #16a34a; font-size: 11px; margin-left: 4px;">(Copié)</span>
          </td>
          <td>
            <img [src]="getProductImage(product)" [alt]="product.name" style="width: 40px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid #e2e8f0; display: block;">
          </td>
          <td style="font-weight: 500;">{{ product.name }}</td>
          <td>{{ product.price | currency:'MAD':'symbol' }}</td>
          <td>
            <span class="stock-badge" [class.out]="product.stockQuantity === 0">{{ product.stockQuantity }}</span>
          </td>
          <td>
            <div style="display: flex; gap: 12px; align-items: center;">
              <!-- Edit -->
              <svg [routerLink]="['/admin/dashboard/products', product.id, 'edit']" class="action-icon edit" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" title="Éditer">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
              </svg>
              <!-- Deactivate (X) -->
              <svg class="action-icon deactivate" (click)="softDelete(product)" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" title="Désactiver">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              <!-- Delete (Trash) -->
              <svg class="action-icon delete" (click)="hardDelete(product)" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" title="Supprimer">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    
    <div *ngIf="filteredProducts.length === 0" class="no-results">
      Aucun produit trouvé.
    </div>
  </div>
</div>
