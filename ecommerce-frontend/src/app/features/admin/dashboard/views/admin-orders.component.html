<div class="admin-view-container">
  <div class="view-header">
    <h1>Gestion des Commandes</h1>
    <div class="search-bar">
      <input type="text" [(ngModel)]="searchTerm" (input)="filterOrders()" placeholder="Rechercher par ID commande ou utilisateur..." />
    </div>
  </div>

  <div *ngIf="isLoading" class="loading">Chargement des commandes...</div>

  <div class="table-container" *ngIf="!isLoading">
    <table class="admin-table">
      <thead>
        <tr>
          <th>ID Commande</th>
          <th>ID Utilisateur</th>
          <th>Total</th>
          <th>Date</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of filteredOrders">
          <td class="id-cell" title="Copier l'ID" (click)="copyId(order.id!)" style="cursor: pointer; color: #1d4ed8;">
            {{ order.id }}
            <span *ngIf="copiedId === order.id" style="color: #16a34a; font-size: 11px; margin-left: 4px;">(Copié)</span>
          </td>
          <td class="id-cell" title="Copier l'ID Utilisateur" (click)="copyId(order.userId!)" style="cursor: pointer; color: #1d4ed8;">
            {{ order.userId }}
            <span *ngIf="copiedId === order.userId" style="color: #16a34a; font-size: 11px; margin-left: 4px;">(Copié)</span>
          </td>
          <td>{{ order.totalAmount | currency:'MAD':'symbol' }}</td>
          <td>{{ order.createdAt | date:'short' }}</td>
          <td>
            <span class="order-status status-{{ order.status.toLowerCase().replace('_', '-') }}" style="padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase;">
              {{ order.status }}
            </span>
          </td>
          <td>
            <ng-container *ngIf="order.status === 'REFUND_REQUESTED'">
              <button class="btn-action view" style="margin-right: 8px; background: #dcfce7; color: #166534;" (click)="approveRefund(order)">Approuver</button>
              <button class="btn-action view" style="margin-right: 8px; background: #fee2e2; color: #991b1b;" (click)="rejectRefund(order)">Rejeter</button>
            </ng-container>
            <svg [routerLink]="['/admin/dashboard/orders', order.id]" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="action-icon view-icon" style="cursor: pointer; color: #3b82f6; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </td>
        </tr>
      </tbody>
    </table>
    
    <div *ngIf="filteredOrders.length === 0" class="no-results">
      Aucune commande trouvée.
    </div>
  </div>
</div>
