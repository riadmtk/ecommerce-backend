<div class="wishlist-container">
  
  <div class="wishlist-header">
    <h2>Ma Wishlist</h2>
    <a routerLink="/products" class="back-link">← Continuer mes achats</a>
  </div>

  <div *ngIf="wishlistWithProducts$ | async as wishlist; else loading">
    
    <div class="empty-state" *ngIf="wishlist.items.length === 0">
      <p>Votre liste est vide pour le moment.</p>
    </div>

    <div class="wishlist-list" *ngIf="wishlist.items.length > 0">
      
      <div class="wishlist-card" *ngFor="let item of wishlist.items">
        
        <div class="item-visual" *ngIf="item.product">
          <img [src]="getProductImage(item.product)" [alt]="item.product.name" class="wishlist-img">
        </div>

        <div class="item-details">
          <h3 class="product-name" *ngIf="item.product">{{ item.product.name }}</h3>
          <p class="product-id" *ngIf="!item.product">ID Produit : {{ item.productId }}</p>
          <p class="added-date">Ajouté le : {{ item.addedAt | date:'short' }}</p>
          
          <div class="restock-toggle">
            <label class="toggle-switch">
              <input type="checkbox" 
                     [checked]="item.notifyOnRestock" 
                     (change)="toggleNotify(item.productId, $event)">
              <span class="slider"></span>
            </label>
            <span class="toggle-label">Alerte de restockage</span>
          </div>
        </div>

        <div class="item-actions">
          <a [routerLink]="['/products', item.productId]" class="btn-view">
            Voir l'article
          </a>
          <button (click)="removeItem(item.productId)" class="btn-remove">
            Retirer
          </button>
        </div>
        
      </div>
    </div>
  </div>

  <ng-template #loading>
    <div class="loading-state">
      <p>Chargement de vos favoris...</p>
    </div>
  </ng-template>

</div>
