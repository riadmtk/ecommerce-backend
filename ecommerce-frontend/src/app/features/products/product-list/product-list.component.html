<div class="product-list-container">
  <h1>Catalogue Produits</h1>

  <div *ngIf="isLoading" class="loading">Chargement...</div>
  <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

  <div *ngIf="!isLoading && !errorMessage" class="products-grid">
    <div class="product-card" *ngFor="let product of products">
      
      <img [src]="getProductImage(product)" [alt]="product.name" />
      
      <div class="product-info">
        <h3>{{ product.name }}</h3>
        <p class="category" *ngIf="product.category">{{ product.category }}</p>
        <p class="price">{{ product.price | currencyMad }}</p>
        <p class="stock" [class.out-of-stock]="product.stockQuantity === 0">
          {{ product.stockQuantity > 0 ? product.stockQuantity + ' en stock' : 'Rupture de stock' }}
        </p>
        <a [routerLink]="['/products', product.id]" class="btn-detail">Voir le détail</a>
      </div>
    </div>
  </div>
</div>
