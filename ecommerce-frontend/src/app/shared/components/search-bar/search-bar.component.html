<div class="global-search-container">
  <input 
    type="text" 
    [(ngModel)]="searchTerm" 
    (input)="onInput()"
    (keyup.enter)="onSearch()"
    (focus)="searchTerm.trim() ? showSuggestions = true : null"
    placeholder="Rechercher un produit..." 
    class="search-input"
  />
  <button (click)="onSearch()" class="search-icon-btn" aria-label="Chercher">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </button>

  <div class="search-suggestions" *ngIf="showSuggestions">
    <div class="suggestion-item" *ngFor="let product of suggestions" (mousedown)="selectSuggestion(product)">
      <img [src]="getProductImage(product)" [alt]="product.name" class="suggestion-img">
      <div class="suggestion-info">
        <span class="suggestion-name">{{ product.name }}</span>
        <span class="suggestion-price">{{ product.price | currencyMad }}</span>
      </div>
    </div>
  </div>
</div>
