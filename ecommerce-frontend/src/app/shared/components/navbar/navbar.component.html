<nav class="navbar">
  <div class="navbar-brand">
    <a routerLink="/products">🛒 E-Commerce</a>
  </div>

  <!-- Nouveau groupe de liens de navigation -->
  <div class="navbar-nav">
    <a routerLink="/products" routerLinkActive="active">Catalogue</a>
    <a routerLink="/products/add" *ngIf="isAdmin$ | async" routerLinkActive="active">
      Ajouter produit
    </a>

    <a routerLink="/admin/orders" *ngIf="isAdmin$ | async" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Gestion des commandes</a>

    <a routerLink="/cart" *ngIf="!(isAdmin$ | async)" routerLinkActive="active">Mon panier</a>

    <ng-container *ngIf="authService.isLoggedIn()">
      <a routerLink="/orders" *ngIf="!(isAdmin$ | async)" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Mes Commandes</a>
      <a routerLink="/profile" routerLinkActive="active">Mon Profil</a>
    </ng-container>

    <ng-container *ngIf="!authService.isLoggedIn()">
      <a routerLink="/auth/login" routerLinkActive="active">Connexion</a>
      <a routerLink="/auth/register" routerLinkActive="active" class="btn-register">
        S'inscrire
      </a>
    </ng-container>
  </div>

  <!-- Bouton Déconnexion (seul à droite) -->
  <div class="navbar-links">
    <ng-container *ngIf="authService.isLoggedIn()">
      <button (click)="logout()" class="btn-logout">Déconnexion</button>
    </ng-container>
  </div>
</nav>
