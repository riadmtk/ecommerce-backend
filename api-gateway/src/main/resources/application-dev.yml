spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**, /api/auth/**

        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**

        - id: search-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/search/**

        - id: cart-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/cart/**

        - id: order-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/orders/**

        - id: payment-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/payments/**

        - id: notification-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/notifications/**

        - id: wishlist-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/wishlist/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG