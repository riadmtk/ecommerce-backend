server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        # --- YOUR API ROUTES (Using localhost) ---
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**, /api/auth/**

        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/products/**

        - id: search-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/search/**

        - id: cart-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/carts/**

        - id: order-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/orders/**

        - id: payment-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/payments/**

        - id: notification-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/notifications/**

        - id: wishlist-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/wishlists/**



        # --- OPENAPI / SWAGGER ROUTES (Using localhost) ---
        - id: user-openapi
          uri: http://localhost:8081
          predicates:
            - Path=/v3/api-docs/user
          filters:
            - RewritePath=/v3/api-docs/user, /v3/api-docs

        - id: product-openapi
          uri: http://localhost:8082
          predicates:
            - Path=/v3/api-docs/product
          filters:
            - RewritePath=/v3/api-docs/product, /v3/api-docs

        - id: search-openapi
          uri: http://localhost:8083
          predicates:
            - Path=/v3/api-docs/search
          filters:
            - RewritePath=/v3/api-docs/search, /v3/api-docs

        - id: cart-openapi
          uri: http://localhost:8084
          predicates:
            - Path=/v3/api-docs/cart
          filters:
            - RewritePath=/v3/api-docs/cart, /v3/api-docs

        - id: order-openapi
          uri: http://localhost:8085
          predicates:
            - Path=/v3/api-docs/order
          filters:
            - RewritePath=/v3/api-docs/order, /v3/api-docs

        - id: payment-openapi
          uri: http://localhost:8086
          predicates:
            - Path=/v3/api-docs/payment
          filters:
            - RewritePath=/v3/api-docs/payment, /v3/api-docs