spring:
  application:
    name: api-gateway
  profiles:
    active: dev
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**, /api/auth/**

        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/api/v1/products/**

        - id: search-service
          uri: http://search-service:8083
          predicates:
            - Path=/api/v1/search/**

        - id: cart-service
          uri: http://cart-service:8084
          predicates:
            - Path=/api/v1/carts/**

        - id: order-service
          uri: http://order-service:8085
          predicates:
            - Path=/api/orders/**

        - id: payment-service
          uri: http://payment-service:8086
          predicates:
            - Path=/api/payments/**

        - id: notification-service
          uri: http://notification-service:8087
          predicates:
            - Path=/api/notifications/**

        - id: wishlist-service
          uri: http://wishlist-service:8088
          predicates:
            - Path=/api/wishlists/**

server:
  port: 8080


springdoc:
  swagger-ui:
    urls:
      - name: 👤 User Service
        url: /v3/api-docs/user
      - name: 📦 Product Service
        url: /v3/api-docs/product
      - name: 🛒 Cart Service
        url: /v3/api-docs/cart
      - name: 🧾 Order Service
        url: /v3/api-docs/order
      - name: 🧾 Search Service
        url: /v3/api-docs/search
      - name: 💳 Payment Service
        url: /v3/api-docs/payment