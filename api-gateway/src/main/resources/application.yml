spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**, /api/auth/**

        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/api/products/**

        - id: search-service
          uri: http://search-service:8083
          predicates:
            - Path=/api/search/**

        - id: cart-service
          uri: http://cart-service:8084
          predicates:
            - Path=/api/cart/**

        - id: order-service
          uri: http://order-service:8085
          predicates:
            - Path=/api/orders/**

        - id: payment-service
          uri: http://payment-service:8086
          predicates:
            - Path=/api/payments/**

        - id: notification-service
          uri: http://notification-service:8087
          predicates:
            - Path=/api/notifications/**

        - id: wishlist-service
          uri: http://wishlist-service:8088
          predicates:
            - Path=/api/wishlist/**

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}