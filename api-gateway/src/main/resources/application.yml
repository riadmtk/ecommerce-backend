server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # ----- USER SERVICE -----
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**, /api/users/**

        # ----- PRODUCT SERVICE -----
        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/products/**

        # ----- SEARCH SERVICE -----
        - id: search-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/search/**

        # ----- CART SERVICE -----
        - id: cart-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/carts/**

        # ----- ORDER SERVICE -----
        - id: order-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/orders/**


springdoc:
  swagger-ui:
    urls:
      - name: user-service
        url: /v3/api-docs/user-service
      - name: product-service
        url: /v3/api-docs/product-service
      - name: cart-service
        url: /v3/api-docs/cart-service
      - name: order-service
        url: /v3/api-docs/order-service
      - name: search-service
        url: /v3/api-docs/search-service